repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-added-large-files
        args: ["--maxkb=1000"]
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff lint
        entry: uv run ruff check
        language: system
        types_or: [python, pyi]
      - id: ruff-format
        name: ruff format check
        entry: uv run ruff format --check
        language: system
        types_or: [python, pyi]
      - id: mypy
        name: mypy strict typecheck
        entry: uv run mypy
        language: system
        pass_filenames: false
        always_run: true
      - id: repo-hygiene
        name: repo hygiene (structure, links, ADRs, secret patterns)
        entry: python scripts/check_repo_hygiene.py
        language: system
        pass_filenames: false
        always_run: true
