# Language-specific formatters/linters are added in scaffolding phase 04 once the stack is chosen (ADR).
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-added-large-files
        args: ["--maxkb=1000"]
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks
  - repo: local
    hooks:
      - id: repo-hygiene
        name: repo hygiene (structure, links, ADRs, secret patterns)
        entry: python scripts/check_repo_hygiene.py
        language: system
        pass_filenames: false
        always_run: true
