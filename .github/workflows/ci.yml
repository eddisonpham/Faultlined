name: ci
on:
  push:
  pull_request:
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: uv sync --locked --all-extras
      - name: Probe the runner environment
        run: |
          echo "::notice title=runner::lsof=$(command -v lsof || echo MISSING) ps=$(command -v ps || echo MISSING) nproc=$(nproc)"
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - name: Run tests
        run: |
          uv run pytest -m "not slow and not gpu" --cov --cov-report=term-missing \
            --tb=line -rf | tee test-output.txt
      # Name the failing tests as workflow annotations. They show on the commit
      # and in the checks API without opening the log, which is the difference
      # between a red build you can act on and one you have to go and read.
      - name: Name the failing tests
        if: failure()
        run: |
          grep -E '^(FAILED|ERROR)' test-output.txt | head -20 | while IFS= read -r line; do
            echo "::error title=pytest::${line//'%'/'%25'}"
          done
          echo "::error title=pytest tail::$(tail -25 test-output.txt | tr '\n' '%0A' | sed 's/%/%25/g' | cut -c1-900)"
      - run: python scripts/check_repo_hygiene.py
      - run: uv run python scripts/openapi_contract.py --check
  optional-slow-gpu:
    if: ${{ vars.RUN_SLOW_GPU_TESTS == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: uv sync --locked --all-extras
      - run: uv run pytest -m "slow or gpu"
