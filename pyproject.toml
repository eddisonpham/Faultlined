[project]
name = "faultlined"
version = "0.1.0"
description = "Faultlined: a robot episode data engine for ingesting, validating, indexing, and curating robot episode datasets with lineage"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.34",
    "pydantic>=2.11",
    "pydantic-settings>=2.9",
    "psycopg[binary]>=3.2",
    "pyarrow>=21",
    "mcap>=1.2",
    "psutil>=7.0",
]

[project.optional-dependencies]
# GPU telemetry only (nvidia-ml-py); everything else works without it (ADR 0008).
gpu = ["nvidia-ml-py>=13"]
# Stage 2.5 clustering experiments only. Nothing in the engine imports numpy, model2vec,
# torch or sentence-transformers, so none of them are runtime dependencies: the engine
# must stay installable without them.
#
# torch is pinned to the **CPU** wheel index. NFR-007 requires a working GPU-absent path
# and the CUDA wheel is ~2.5 GB of download for hardware this stage does not use; the
# extra index is declared in `[tool.uv.sources]` below so `uv sync --all-extras` resolves
# CPU torch without anyone having to remember a flag.
experiments = [
    "numpy>=2",
    "model2vec>=0.4",
    "torch>=2.5",
    "sentence-transformers>=3.3",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform != 'darwin'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[project.scripts]
de = "data_engine.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.4",
    "pytest-cov>=6",
    "httpx>=0.28",
    "mypy>=1.17",
    "ruff>=0.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/data_engine"]

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "C4", "RET", "ARG"]
ignore = ["RET504", "SIM108"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ARG001", "ARG002", "ARG003"]

[tool.mypy]
strict = true
python_version = "3.14"
mypy_path = "src"
packages = ["data_engine"]

[[tool.mypy.overrides]]
module = ["pyarrow.*", "mcap.*", "nvidia_ml_py.*", "pynvml.*", "psutil.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["psutil"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disallow_untyped_calls = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "unit: pure logic, state machines, validators (fast, no IO)",
    "contract: API surface and schema contract tests",
    "integration: components with real DB/queue/storage",
    "e2e: full workflow through public interfaces",
    "gpu: requires a CUDA GPU; skips cleanly when absent",
    "slow: long-running; excluded from the default test run",
    "network: needs outbound HTTPS; skips cleanly when the hub is unreachable",
]

[tool.coverage.run]
source = ["src/data_engine"]
branch = true

[tool.coverage.report]
# Ratchet policy: ADR 0011 — this number may only increase.
fail_under = 70
omit = [
    "src/data_engine/jobs/contracts.py",
    "src/data_engine/ingest/readers/base.py",
    "src/data_engine/workloads/sdk.py",
]
exclude_also = [
    "raise NotImplementedError",
    "\\.\\.\\.$",
    "if TYPE_CHECKING:",
    "class .*\\(Protocol\\):",
    "if __name__ == .__main__.:",
]
